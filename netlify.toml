[build.environment]
  # Next.js 16 toolchain expects Node.js 22+
  NODE_VERSION = "22"
  # Ensure devDependencies are installed during the Netlify build
  NPM_FLAGS = "--include=dev"
  # Disable secrets scanning: it false-positives on Next.js build cache/output
  # where env values are inlined. Real secrets are injected at runtime via
  # Netlify environment variables and are NEVER committed to the repo.
  SECRETS_SCAN_ENABLED = "false"
  SECRETS_SCAN_OMIT_PATHS = ".next/**,.netlify/**,node_modules/**"